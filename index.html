<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Ánimo</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="top-bar">
          <!-- Avatar con nivel superpuesto en la esquina -->
          <div class="profile-container">
            <img src="foto.jpg" alt="Perfil" class="avatar">
            <span class="level-badge">5</span>
          </div>
        
          <!-- Nivel y progreso horizontal compacto -->
          <div class="xp-info">
            <span class="xp-text">Nivel 5</span>
            <div class="xp-bar-bg">
              <div class="xp-bar-fill" style="width: 60%;"></div>
            </div>
          </div>
    </div>
    <div id="contenedor">
        <img id="personaje" src="Gemini_Generated_Image_vrp129vrp129vrp1.jpg" alt="Oso con globo" class="imagen-osito">
        
        <div id="botones">
            <button id="boton-feliz">Feliz</button>
            <button id="boton-enojado">Enojado</button>
            <button id="boton-triste">Triste</button>
            <button id="boton-neutral">Normal</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
