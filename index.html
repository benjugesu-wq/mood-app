<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Ánimo</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="top-bar">
      <!-- Perfil compacto que ya teníamos -->
      <div class="profile-container">
        <img src="foto.jpg" alt="Perfil" class="avatar">
        <span class="level-badge">5</span>
      </div>
    
      <!-- Botón Selector de Misiones -->
      <div class="missions-dropdown">
        <button class="dropdown-btn" onclick="toggleMenu()">
          🎯 Misiones <span class="arrow">▼</span>
        </button>
        
        <!-- Submenú desplegable -->
        <div class="dropdown-content" id="missionsMenu">
          <a href="#" class="mission-item amor">❤️ Amor</a>
          <a href="#" class="mission-item tareas">📝 Tareas</a>
          <a href="#" class="mission-item gym">🏋️‍♂️ Gym</a>
        </div>
      </div>
    </div>
    <div id="contenedor">
        <img id="personaje" src="Gemini_Generated_Image_vrp129vrp129vrp1.jpg" alt="Oso con globo" class="imagen-osito">
        
        <div id="botones">
            <button id="boton-feliz">Feliz</button>
            <button id="boton-enojado">Enojado</button>
            <button id="boton-triste">Triste</button>
            <button id="boton-neutral">Normal</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
